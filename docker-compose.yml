services:
  postgres:
    image: postgres:17-alpine
    container_name: commerce-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: commerce_local_dev_only
      POSTGRES_DB: commerce_engine

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - commerce_pg_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce -d commerce_engine"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  commerce_pg_data: